<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced JavaScript Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .calculator {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 350px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
        }

        .mode-toggle {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .mode-toggle:hover {
            background: #764ba2;
        }

        .mode-toggle:active {
            transform: scale(0.95);
        }

        #display {
            width: 100%;
            height: 70px;
            font-size: 32px;
            text-align: right;
            margin-bottom: 15px;
            box-sizing: border-box;
            padding: 15px;
            background: #2d2d2d;
            color: #fff;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-weight: bold;
            word-wrap: break-word;
            word-break: break-all;
        }

        #memory-display {
            font-size: 14px;
            color: #888;
            height: 20px;
            margin-bottom: 10px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 50px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .number {
            background: #404040;
            color: #fff;
        }

        .number:hover {
            background: #505050;
        }

        .operator {
            background: #667eea;
            color: white;
        }

        .operator:hover {
            background: #764ba2;
        }

        .clear {
            background: #e74c3c;
            color: white;
            grid-column: span 2;
        }

        .clear:hover {
            background: #c0392b;
        }

        .equals {
            background: #2ecc71;
            color: white;
            grid-column: span 2;
            font-size: 20px;
        }

        .equals:hover {
            background: #27ae60;
        }

        .memory {
            background: #f39c12;
            color: white;
            font-size: 14px;
            height: 40px;
        }

        .memory:hover {
            background: #e67e22;
        }

        .scientific {
            display: none;
        }

        .scientific.show {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #404040;
        }

        .scientific button {
            height: 45px;
            font-size: 16px;
        }

        .panel {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .history {
            width: 300px;
            max-height: 500px;
            overflow-y: auto;
        }

        .history h2 {
            margin-bottom: 15px;
            color: #667eea;
            font-size: 18px;
        }

        .history-item {
            background: #2d2d2d;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
            cursor: pointer;
            transition: background 0.2s;
            word-break: break-all;
            font-size: 14px;
        }

        .history-item:hover {
            background: #3d3d3d;
        }

        .clear-history {
            width: 100%;
            padding: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .clear-history:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .calculator, .history {
                width: 100%;
                max-width: 350px;
            }

            .buttons {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .tooltip {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="calculator">
        <div class="header">
            <h1>🧮 Calc</h1>
            <button class="mode-toggle" onclick="toggleScientific()">Scientific</button>
        </div>

        <div id="memory-display"></div>
        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <!-- Basic Calculator Buttons -->
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="deleteNumber()">⌫</button>
            <button class="operator" onclick="addOperator('%')">%</button>

            <button class="number" onclick="addNumber('7')">7</button>
            <button class="number" onclick="addNumber('8')">8</button>
            <button class="number" onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addOperator('/')" title="Divide">÷</button>

            <button class="number" onclick="addNumber('4')">4</button>
            <button class="number" onclick="addNumber('5')">5</button>
            <button class="number" onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addOperator('*')" title="Multiply">×</button>

            <button class="number" onclick="addNumber('1')">1</button>
            <button class="number" onclick="addNumber('2')">2</button>
            <button class="number" onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addOperator('-')" title="Subtract">−</button>

            <button class="number" onclick="addNumber('0')">0</button>
            <button class="number" onclick="addNumber('.')">.</button>
            <button class="operator" onclick="toggleSign()">±</button>
            <button class="operator" onclick="addOperator('+')" title="Add">+</button>

            <button class="equals" onclick="calculate()">=</button>

            <!-- Memory Buttons -->
            <button class="memory" onclick="memoryClear()">MC</button>
            <button class="memory" onclick="memoryRecall()">MR</button>
            <button class="memory" onclick="memoryAdd()">M+</button>
            <button class="memory" onclick="memorySubtract()">M−</button>

            <!-- Scientific Calculator Buttons -->
            <div class="scientific" id="scientific-buttons">
                <button class="operator" onclick="addFunction('sin(')">sin</button>
                <button class="operator" onclick="addFunction('cos(')">cos</button>
                <button class="operator" onclick="addFunction('tan(')">tan</button>
                <button class="operator" onclick="addFunction('sqrt(')">√</button>

                <button class="operator" onclick="addFunction('Math.pow(')">x^y</button>
                <button class="operator" onclick="addFunction('Math.log10(')">log</button>
                <button class="operator" onclick="addFunction('Math.log(')">ln</button>
                <button class="operator" onclick="addConstant('Math.PI')">π</button>

                <button class="operator" onclick="addConstant('Math.E')">e</button>
                <button class="operator" onclick="addFunction('Math.abs(')">|x|</button>
                <button class="operator" onclick="addFunction('Math.factorial(')">n!</button>
                <button class="operator" onclick="addFunction('Math.asin(')">sin⁻¹</button>

                <button class="operator" onclick="addFunction('Math.acos(')">cos⁻¹</button>
                <button class="operator" onclick="addFunction('Math.atan(')">tan⁻¹</button>
                <button class="operator" onclick="addFunction('(')">( )</button>
                <button class="operator" onclick="closeParen()">)</button>
            </div>
        </div>
    </div>

    <div class="history panel">
        <h2>📋 History</h2>
        <div id="history-list"></div>
        <button class="clear-history" onclick="clearHistory()">Clear History</button>
    </div>
</div>

<script>
    let display = document.getElementById("display");
    let memoryValue = 0;
    let history = [];
    let scientificMode = false;
    let lastResult = 0;

    // Load history and memory from localStorage
    window.addEventListener('load', () => {
        const savedHistory = localStorage.getItem('calculatorHistory');
        const savedMemory = localStorage.getItem('calculatorMemory');
        if (savedHistory) history = JSON.parse(savedHistory);
        if (savedMemory) memoryValue = parseFloat(savedMemory);
        updateMemoryDisplay();
        updateHistoryDisplay();
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
        const key = e.key;

        if (/[0-9]/.test(key)) {
            addNumber(key);
            visualFeedback(key);
        } else if (key === '.') {
            addNumber('.');
            visualFeedback('.');
        } else if (key === '+' || key === '-' || key === '*' || key === '/') {
            addOperator(key);
            visualFeedback(key);
        } else if (key === 'Enter' || key === '=') {
            e.preventDefault();
            calculate();
            visualFeedback('=');
        } else if (key === 'Backspace') {
            e.preventDefault();
            deleteNumber();
            visualFeedback('⌫');
        } else if (key.toLowerCase() === 'c') {
            clearDisplay();
            visualFeedback('C');
        } else if (key === '(') {
            addFunction('(');
            visualFeedback('(');
        } else if (key === ')') {
            closeParen();
            visualFeedback(')');
        }
    });

    // Visual feedback for keyboard input
    function visualFeedback(key) {
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            if (btn.textContent.includes(key) || btn.textContent === key) {
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    btn.style.transform = '';
                }, 100);
            }
        });
    }

    function addNumber(number) {
        if (display.value === "0" && number !== ".") {
            display.value = number;
        } else if (number === "." && display.value.includes(".")) {
            return;
        } else {
            display.value += number;
        }
    }

    function addOperator(operator) {
        const lastChar = display.value[display.value.length - 1];
        if (!/[+\-*/%]/.test(lastChar)) {
            display.value += operator;
        }
    }

    function addFunction(func) {
        if (display.value === "0") {
            display.value = func;
        } else {
            display.value += func;
        }
    }

    function addConstant(constant) {
        if (display.value === "0") {
            display.value = constant;
        } else {
            display.value += constant;
        }
    }

    function closeParen() {
        display.value += ')';
    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteNumber() {
        if (display.value.length > 1) {
            display.value = display.value.slice(0, -1);
        } else {
            display.value = "0";
        }
    }

    function toggleSign() {
        const value = parseFloat(display.value);
        if (!isNaN(value)) {
            display.value = -value;
        }
    }

    function calculate() {
        try {
            // Add Math functions to scope
            const mathFunctions = {
                sin: (x) => Math.sin(x * Math.PI / 180),
                cos: (x) => Math.cos(x * Math.PI / 180),
                tan: (x) => Math.tan(x * Math.PI / 180),
                sqrt: Math.sqrt,
                log: Math.log10,
                abs: Math.abs,
                asin: (x) => Math.asin(x) * 180 / Math.PI,
                acos: (x) => Math.acos(x) * 180 / Math.PI,
                atan: (x) => Math.atan(x) * 180 / Math.PI,
                factorial: (n) => {
                    if (n < 0) throw new Error("Negative factorial");
                    if (n === 0 || n === 1) return 1;
                    let result = 1;
                    for (let i = 2; i <= n; i++) result *= i;
                    return result;
                }
            };

            let expression = display.value;
            
            // Replace Math functions and constants
            expression = expression.replace(/sin\(/g, 'mathFunctions.sin(');
            expression = expression.replace(/cos\(/g, 'mathFunctions.cos(');
            expression = expression.replace(/tan\(/g, 'mathFunctions.tan(');
            expression = expression.replace(/sqrt\(/g, 'mathFunctions.sqrt(');
            expression = expression.replace(/log10\(/g, 'mathFunctions.log(');
            expression = expression.replace(/Math\.log10\(/g, 'mathFunctions.log(');
            expression = expression.replace(/Math\.log\(/g, 'Math.log(');
            expression = expression.replace(/Math\.abs\(/g, 'mathFunctions.abs(');
            expression = expression.replace(/Math\.factorial\(/g, 'mathFunctions.factorial(');
            expression = expression.replace(/Math\.asin\(/g, 'mathFunctions.asin(');
            expression = expression.replace(/Math\.acos\(/g, 'mathFunctions.acos(');
            expression = expression.replace(/Math\.atan\(/g, 'mathFunctions.atan(');
            expression = expression.replace(/Math\.pow\(/g, 'Math.pow(');
            expression = expression.replace(/Math\.PI/g, Math.PI);
            expression = expression.replace(/Math\.E/g, Math.E);

            const result = Function('"use strict"; return (' + expression + ')')();
            
            if (!isFinite(result)) {
                display.value = "Error";
            } else {
                lastResult = result;
                display.value = result;
                addToHistory(`${display.value} = ${result}`);
            }
        } catch (error) {
            display.value = "Error: " + error.message;
        }
    }

    // Memory Functions
    function memoryClear() {
        memoryValue = 0;
        updateMemoryDisplay();
    }

    function memoryRecall() {
        display.value = memoryValue;
        updateMemoryDisplay();
    }

    function memoryAdd() {
        try {
            memoryValue += parseFloat(display.value) || 0;
            updateMemoryDisplay();
            clearDisplay();
        } catch {
            display.value = "Error";
        }
    }

    function memorySubtract() {
        try {
            memoryValue -= parseFloat(display.value) || 0;
            updateMemoryDisplay();
            clearDisplay();
        } catch {
            display.value = "Error";
        }
    }

    function updateMemoryDisplay() {
        const memoryDisplay = document.getElementById('memory-display');
        memoryDisplay.textContent = memoryValue !== 0 ? `Memory: ${memoryValue.toFixed(2)}` : '';
        localStorage.setItem('calculatorMemory', memoryValue);
    }

    // History Functions
    function addToHistory(calculation) {
        history.unshift(calculation);
        if (history.length > 20) history.pop();
        updateHistoryDisplay();
        localStorage.setItem('calculatorHistory', JSON.stringify(history));
    }

    function updateHistoryDisplay() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';
        history.forEach((item, index) => {
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.textContent = item;
            historyItem.onclick = () => {
                const result = item.split(' = ')[1];
                display.value = result;
            };
            historyList.appendChild(historyItem);
        });
    }

    function clearHistory() {
        if (confirm('Clear all history?')) {
            history = [];
            updateHistoryDisplay();
            localStorage.removeItem('calculatorHistory');
        }
    }

    // Scientific Mode Toggle
    function toggleScientific() {
        scientificMode = !scientificMode;
        const scientificButtons = document.getElementById('scientific-buttons');
        scientificButtons.classList.toggle('show');
    }
</script>

</body>
</html>
